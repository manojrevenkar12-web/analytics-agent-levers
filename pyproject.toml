[project]
name = "analytics-agent-levers"
version = "1.0.0"
description = "Which product changes make a data agent right more often, cheaper and more trusted: an agent on ClickHouse through MCP, traced in Langfuse format, each lever measured against a launch gate"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "chdb>=3.0", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts", "tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["alv"]
known-local-folder = ["helpers"]
